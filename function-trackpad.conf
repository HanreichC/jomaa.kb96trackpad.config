# Jomaa KB96 "Function Trackpad" reports the USB ID of an Apple Magic Trackpad 2 (05ac:0265),
# but speaks standard Precision Touchpad. hid-magicmouse grabs it and drops its reports;
# without it, hid-multitouch binds and the pad works.
# ponytail: disables real Apple Magic Mouse/Trackpad devices too. If you get one, replace this
# with a udev rule that rebinds only this device (the fake reports no USB manufacturer string).
blacklist hid_magicmouse
